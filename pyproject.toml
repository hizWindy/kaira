[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow"
version = "0.1.0"
description = "Automated FastAPI scaffolding CLI tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevFlow" }]
keywords = ["fastapi", "scaffolding", "cli", "codegen", "sqlalchemy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "fastapi>=0.110.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "questionary>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]
cache = [
    "redis>=5.0.0",
]
task = [
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",
]
fuzzy = [
    "rapidfuzz>=3.0.0",
]
audit = [
    "pip-audit>=2.7.0",
]
all = [
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",
    "rapidfuzz>=3.0.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
devflow = "devflow.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["devflow*"]

[tool.setuptools.package-data]
devflow = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
