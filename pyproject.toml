[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khaira"
version = "0.2.6"
description = "Automated FastAPI scaffolding CLI and framework runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khair" }]
keywords = ["fastapi", "scaffolding", "cli", "codegen", "sqlalchemy", "framework"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "questionary>=2.0.1",
    "InquirerPy>=0.3.4",
]

[project.optional-dependencies]
security = [
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "Authlib>=1.3.0",
    "cryptography>=41.0.0",
    "pip-audit>=2.7.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "langchain>=0.1.0",
    "langchain-community",
    "langchain-openai",
    "langgraph>=0.2.0",
    "llama-index>=0.10.0",
    "cohere>=5.0.0",
    "google-generativeai",
    "chromadb>=0.4.0",
]
orm = [
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.14",
    "peewee>=3.17.0",
    "tortoise-orm>=0.20.0",
    "beanie>=1.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "PyYAML>=6.0.0",
    # Not a Kaira runtime dependency — a *generated* project declares it. Kept
    # here so the monitoring tests exercise the real exposition path rather than
    # only the no-op shim core/metrics.py falls back to.
    "prometheus-client>=0.20.0",
]
cache = [
    "redis>=5.0.0",
]
task = [
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",
]
fuzzy = [
    "rapidfuzz>=3.0.0",
]
audit = [
    "pip-audit>=2.7.0",
]
export = [
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
]
all = [
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",
    "rapidfuzz>=3.0.0",
    "pip-audit>=2.7.0",
    "InquirerPy>=0.3.4",
    "asyncpg>=0.29.0",
    "motor>=3.3.0",
    "beanie>=1.24.0",
    "google-cloud-firestore>=2.16.0",
    "aiosqlite>=0.20.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
]
cloud = [
    "asyncpg>=0.29.0",
    "motor>=3.3.0",
    "beanie>=1.24.0",
    "google-cloud-firestore>=2.16.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
khaira = "kaira.main:app"
kaira = "kaira.main:app"

[project.urls]
Homepage = "https://github.com/hizWindy/DevFlow"
Documentation = "https://github.com/hizWindy/DevFlow#readme"
Repository = "https://github.com/hizWindy/DevFlow"
Issues = "https://github.com/hizWindy/DevFlow/issues"
Changelog = "https://github.com/hizWindy/DevFlow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["kaira*", "khaira*"]

[tool.setuptools.package-data]
kaira = ["templates/*.j2", "templates/firestore/*.j2", "templates/docs/*.j2", "templates/skills/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
